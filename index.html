<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSM Constructor — BPI Group</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ─── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3;
  --bg2: #ffffff;
  --bg3: #efefeb;
  --text: #1a1a18;
  --text2: #5f5e5a;
  --text3: #9b9a96;
  --border: rgba(0,0,0,0.12);
  --border2: rgba(0,0,0,0.22);
  --accent: #185fa5;
  --accent-bg: #e6f1fb;
  --success: #0f6e56;
  --success-bg: #e1f5ee;
  --warn: #ba7517;
  --warn-bg: #faeeda;
  --danger: #a32d2d;
  --danger-bg: #fcebeb;
  --radius: 6px;
  --radius-lg: 10px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18; --bg2: #242422; --bg3: #2e2e2b;
    --text: #e8e6df; --text2: #9b9a96; --text3: #5f5e5a;
    --accent-bg: #0c2d4a; --success-bg: #04201a;
    --warn-bg: #2a1c05; --danger-bg: #2a0d0d;
  }
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }

/* ─── Layout ─── */
.app { display: flex; flex-direction: column; height: 100vh; }

/* ─── Header ─── */
.header {
  height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--bg2); border-bottom: 0.5px solid var(--border);
  flex-shrink: 0; user-select: none;
}
.logo { font-weight: 600; font-size: 13px; letter-spacing: -0.02em; }
.logo span { color: var(--accent); }
.hdr-sep { width: 0.5px; height: 20px; background: var(--border); margin: 0 4px; }
.hdr-btn {
  display: flex; align-items: center; gap: 5px; padding: 4px 9px;
  border: 0.5px solid var(--border); border-radius: var(--radius);
  background: none; color: var(--text); cursor: pointer; font-size: 12px;
  transition: background .12s, border-color .12s; white-space: nowrap;
}
.hdr-btn:hover { background: var(--bg3); border-color: var(--border2); }
.hdr-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.hdr-btn i { font-size: 15px; }
.hdr-spacer { flex: 1; }
.map-name-input {
  font-size: 13px; font-weight: 500; background: none; border: none; color: var(--text);
  border-bottom: 1px dashed var(--border); padding: 2px 4px; width: 200px; text-align: center;
}
.map-name-input:focus { outline: none; border-bottom-color: var(--accent); }
.map-name-input::placeholder { color: var(--text3); }

/* ─── Main area ─── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ─── Sidebar (palette) ─── */
.sidebar {
  width: 168px; flex-shrink: 0; background: var(--bg2);
  border-right: 0.5px solid var(--border); display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-section { padding: 10px 8px 4px; }
.sidebar-title {
  font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text3); padding: 0 2px 6px;
}
.pal-item {
  display: flex; align-items: center; gap: 7px; padding: 6px 8px;
  border: 0.5px solid var(--border); border-radius: var(--radius);
  margin-bottom: 3px; cursor: grab; background: var(--bg2); font-size: 11px;
  transition: border-color .12s, background .12s;
}
.pal-item:hover { border-color: var(--border2); background: var(--bg3); }
.pal-item:active { cursor: grabbing; }
.pal-icon { width: 30px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ─── Canvas ─── */
.canvas-wrap {
  flex: 1; position: relative; overflow: hidden; background: var(--bg);
  cursor: default;
}
#canvas { width: 100%; height: 100%; }

/* ─── Right panel ─── */
.rpanel {
  width: 248px; flex-shrink: 0; background: var(--bg2);
  border-left: 0.5px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
}
.rtabs { display: flex; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.rtab {
  flex: 1; padding: 9px 4px; font-size: 11px; font-weight: 500; text-align: center;
  cursor: pointer; border: none; background: none; color: var(--text2);
  border-bottom: 2px solid transparent; transition: color .12s;
}
.rtab.active { color: var(--text); border-bottom-color: var(--accent); }
.rpanel-body { flex: 1; overflow-y: auto; padding: 12px; }

/* Props */
.prop-group { margin-bottom: 10px; }
.prop-label { font-size: 10px; color: var(--text2); margin-bottom: 3px; font-weight: 500; }
.prop-input {
  width: 100%; font-size: 12px; padding: 5px 7px;
  border: 0.5px solid var(--border2); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-family: var(--font);
}
.prop-input:focus { outline: none; border-color: var(--accent); }
.prop-row { display: flex; gap: 6px; }
.prop-row .prop-group { flex: 1; }

.section-head {
  font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text3); padding: 8px 0 5px; border-top: 0.5px solid var(--border); margin-top: 4px;
}
.no-sel { text-align: center; padding: 30px 0; color: var(--text3); font-size: 12px; }
.no-sel i { font-size: 28px; display: block; margin-bottom: 8px; opacity: .35; }

.del-btn {
  width: 100%; padding: 5px; font-size: 11px; color: var(--danger); margin-top: 10px;
  border: 0.5px solid var(--danger); border-radius: var(--radius);
  background: none; cursor: pointer;
}
.del-btn:hover { background: var(--danger-bg); }

/* Metrics */
.metric-card {
  border-radius: var(--radius); padding: 10px 11px; margin-bottom: 8px;
  border: 0.5px solid var(--border);
}
.metric-lbl { font-size: 10px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.metric-val { font-size: 22px; font-weight: 500; line-height: 1.2; margin-top: 2px; }
.metric-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.proc-row { display: flex; align-items: center; gap: 6px; padding: 3px 5px; border-radius: 4px; }
.proc-row:hover { background: var(--bg3); }
.proc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* AI */
.ai-run-btn {
  width: 100%; padding: 8px; font-size: 12px; font-weight: 500;
  border: 0.5px solid var(--border2); border-radius: var(--radius);
  background: var(--bg3); color: var(--text); cursor: pointer; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .12s;
}
.ai-run-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.ai-run-btn:disabled { opacity: .5; cursor: not-allowed; }
.ai-out {
  font-size: 12px; line-height: 1.65; color: var(--text2);
  background: var(--bg3); border-radius: var(--radius); padding: 10px 11px;
  white-space: pre-wrap; word-break: break-word;
}
.ai-key-row { display: flex; gap: 5px; margin-bottom: 8px; }
.ai-key-input { flex: 1; font-size: 11px; padding: 4px 7px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); }
.ai-save-btn { font-size: 11px; padding: 4px 8px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg3); color: var(--text); cursor: pointer; }
.ai-save-btn:hover { background: var(--success-bg); color: var(--success); }
.ai-hint { font-size: 10px; color: var(--text3); line-height: 1.5; margin-bottom: 8px; }

/* Maps list */
.map-row {
  display: flex; align-items: center; gap: 6px; padding: 5px 7px;
  border: 0.5px solid var(--border); border-radius: var(--radius); margin-bottom: 4px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.map-row:hover { border-color: var(--border2); background: var(--bg3); }
.map-row-name { flex: 1; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-row-date { font-size: 10px; color: var(--text3); }
.map-del-btn { font-size: 13px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 3px; }
.map-del-btn:hover { color: var(--danger); background: var(--danger-bg); }
.empty-maps { font-size: 12px; color: var(--text3); text-align: center; padding: 20px 0; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.modal {
  background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-lg);
  padding: 20px 22px; width: 340px; max-width: 95vw;
}
.modal-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.modal-btns { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
.modal-btn {
  padding: 6px 14px; font-size: 12px; border-radius: var(--radius);
  border: 0.5px solid var(--border2); background: var(--bg3); color: var(--text); cursor: pointer;
}
.modal-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-btn:hover { opacity: .85; }
.modal-opts { display: flex; flex-direction: column; gap: 8px; }
.modal-opt {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer;
  transition: border-color .12s, background .12s;
}
.modal-opt:hover { border-color: var(--accent); background: var(--accent-bg); }
.modal-opt i { font-size: 20px; color: var(--accent); }
.modal-opt-title { font-size: 12px; font-weight: 500; }
.modal-opt-sub { font-size: 11px; color: var(--text2); }

/* Toasts */
.toast-area { position: fixed; bottom: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 6px; }
.toast {
  background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius);
  padding: 8px 14px; font-size: 12px; min-width: 180px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); animation: toastIn .2s ease;
}
.toast.ok { border-left: 3px solid var(--success); }
.toast.err { border-left: 3px solid var(--danger); }
@keyframes toastIn { from { opacity:0; transform: translateY(8px); } }

.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.canvas-wrap.connect-mode { cursor: crosshair; }

/* Timeline bar */
.timeline { 
  height: 48px; background: var(--bg2); border-top: 0.5px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
  flex-shrink: 0; overflow: hidden;
}
.tl-label { font-size: 10px; color: var(--text3); white-space: nowrap; }
.tl-bar-wrap { flex: 1; height: 16px; border-radius: 3px; overflow: hidden; display: flex; }
.tl-va { background: #1d9e75; height: 100%; display: flex; align-items: center; justify-content: center; }
.tl-nva { background: #e24b4a; height: 100%; display: flex; align-items: center; justify-content: center; }
.tl-bar-lbl { font-size: 9px; color: #fff; font-weight: 600; white-space: nowrap; padding: 0 4px; }
.tl-stat { font-size: 11px; white-space: nowrap; }
.tl-stat strong { font-weight: 600; }
.tl-eff { font-size: 11px; font-weight: 600; white-space: nowrap; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">VSM <span>Constructor</span></div>
    <div class="hdr-sep"></div>
    <input class="map-name-input" id="mapName" type="text" value="Нова карта VSM" placeholder="Назва карти…">
    <div class="hdr-spacer"></div>

    <button class="hdr-btn active" id="btn-select" onclick="setTool('select')" title="Вибір (V)">
      <i class="ti ti-pointer"></i> Вибір
    </button>
    <button class="hdr-btn" id="btn-connect" onclick="setTool('connect')" title="З'єднання (C)">
      <i class="ti ti-arrow-right"></i> З'єднати
    </button>

    <div class="hdr-sep"></div>

    <button class="hdr-btn" onclick="showSaveMapsModal()" title="Зберегти / Відкрити карти">
      <i class="ti ti-folder"></i> Карти
    </button>
    <button class="hdr-btn" onclick="saveToLocal()" title="Швидке збереження">
      <i class="ti ti-device-floppy"></i> Зберегти
    </button>
    <button class="hdr-btn" onclick="exportJSON()" title="Експорт JSON">
      <i class="ti ti-file-export"></i> JSON
    </button>
    <button class="hdr-btn" id="importBtn" onclick="document.getElementById('importFile').click()" title="Імпорт JSON">
      <i class="ti ti-file-import"></i>
    </button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">

    <div class="hdr-sep"></div>
    <button class="hdr-btn" onclick="loadDemo()" title="Завантажити приклад">
      <i class="ti ti-template"></i> Приклад
    </button>
    <button class="hdr-btn" onclick="clearCanvas()" title="Очистити полотно">
      <i class="ti ti-trash"></i>
    </button>
    <button class="hdr-btn" onclick="showSettings()" title="Налаштування">
      <i class="ti ti-settings"></i>
    </button>
  </div>

  <div class="main">

    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Елементи</div>

        <div class="pal-item" draggable="true" ondragstart="palDragStart(event,'zone')" style="border: 1px dashed var(--accent); background: var(--accent-bg);">
          <div class="pal-icon">
            <i class="ti ti-box-margin" style="font-size: 18px; color: var(--accent)"></i>
          </div>
          <strong>Дільниця / РМ</strong>
        </div>

        <div class="pal-item" draggable="true" ondragstart="palDragStart(event,'process')">
          <div class="pal-icon">
            <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="26" height="18" rx="1"/></svg>
          </div>
          Процес (Операція)
        </div>
        <div class="pal-item" draggable="true" ondragstart="palDragStart(event,'inventory')">
          <div class="pal-icon">
            <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.3"><polygon points="15,2 28,20 2,20" stroke-linejoin="round"/><text x="15" y="15" font-size="9" text-anchor="middle" font-family="Inter,sans-serif" font-weight="bold" fill="currentColor" stroke="none">I</text></svg>
          </div>
          Запаси / WIP
        </div>
        <div class="pal-item" draggable="true" ondragstart="palDragStart(event,'customer')">
          <div class="pal-icon">
            <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 10 L2 22 L28 22 L28 10 L15 2 Z M8 22 L8 15 L14 15 L14 22 M20 10 L20 14 L24 14 L24 10" stroke-linejoin="round"/></svg>
          </div>
          Клієнт
        </div>
        <div class="pal-item" draggable="true" ondragstart="palDragStart(event,'supplier')">
          <div class="pal-icon">
            <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 10 L2 22 L28 22 L28 10 L15 2 Z M8 22 L8 15 L14 15 L14 22 M20 10 L20 14 L24 14 L24 10" stroke-linejoin="round"/></svg>
          </div>
          Постачальник
        </div>
        <div class="pal-item" draggable="true" ondragstart="palDragStart(event,'kaizen')">
          <div class="pal-icon">
            <svg width="30" height="24" viewBox="0 0 30 24"><path d="M15 2 L18 8 L25 7 L21 12 L27 16 L20 17 L19 23 L14 18 L8 22 L9 15 L3 13 L10 10 Z" fill="none" stroke="#e85d30" stroke-width="1.2" stroke-linejoin="round"/><text x="15" y="15" font-size="8" text-anchor="middle" fill="#e85d30" font-weight="700" font-family="Inter,sans-serif">K</text></svg>
          </div>
          Kaizen Burst
        </div>
      </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap" ondragover="event.preventDefault()" ondrop="onDrop(event)">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" onmousedown="svgMouseDown(event)" onmousemove="svgMouseMove(event)" onmouseup="svgMouseUp(event)" oncontextmenu="return false">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0L0 0 0 20" fill="none" stroke="var(--border)" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect id="gridBg" width="100%" height="100%" fill="url(#grid)"/>
        <g id="zoneLayer"></g>
        <g id="connLayer"></g>
        <g id="elLayer"></g>
        <g id="tempArrow" style="display:none">
          <line id="tempLine" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
        </g>
      </svg>
    </div>

    <div class="rpanel">
      <div class="rtabs">
        <button class="rtab active" id="rtab-props" onclick="switchRTab('props')">Параметри</button>
        <button class="rtab" id="rtab-metrics" onclick="switchRTab('metrics')">Метрики</button>
        <button class="rtab" id="rtab-maps" onclick="switchRTab('maps')">Карти</button>
        <button class="rtab" id="rtab-ai" onclick="switchRTab('ai')">Gemini AI</button>
      </div>
      <div class="rpanel-body" id="rpb-props">
        <div class="no-sel" id="noSelMsg"><i class="ti ti-hand-finger"></i>Виберіть елемент<br>для редагування</div>
        <div id="propsForm" style="display:none"></div>
      </div>
      <div class="rpanel-body" id="rpb-metrics" style="display:none">
        <div id="metricsContent"></div>
      </div>
      <div class="rpanel-body" id="rpb-maps" style="display:none">
        <div id="mapsContent"></div>
      </div>
      <div class="rpanel-body" id="rpb-ai" style="display:none">
        <div class="prop-label" style="margin-bottom:4px;">Google Gemini API ключ</div>
        <div class="ai-key-row">
          <input class="ai-key-input" type="password" id="aiKeyInput" placeholder="AIzaSy…">
          <button class="ai-save-btn" onclick="saveApiKey()"><i class="ti ti-check"></i></button>
        </div>
        <p class="ai-hint">Ключ зберігається в браузері. Отримати безкоштовно: <a href="https://aistudio.google.com" target="_blank" style="color:var(--accent)">aistudio.google.com</a></p>
        <button class="ai-run-btn" id="aiRunBtn" onclick="runAi()">
          <i class="ti ti-sparkles"></i> Проаналізувати потік (Gemini)
        </button>
        <div id="aiOut" style="display:none" class="ai-out"></div>
      </div>
    </div>

  </div>

  <div class="timeline" id="timeline">
    <span class="tl-label">Lead Time</span>
    <div class="tl-bar-wrap" id="tlBar">
      <div class="tl-va" style="width:10%"><span class="tl-bar-lbl">VA</span></div>
      <div class="tl-nva" style="width:90%"><span class="tl-bar-lbl">NVA</span></div>
    </div>
    <span class="tl-stat" id="tlLT">—</span>
    <span class="tl-eff" id="tlEff" style="color:var(--text3)">—</span>
  </div>

</div>

<div id="modalOverlay" class="modal-overlay" style="display:none" onclick="closeModal(event)"></div>
<div id="modal" class="modal" style="display:none"></div>
<div id="toastArea" class="toast-area"></div>

<script>
/* ══════════════════════════════════════════
   STATE & DEFAULTS
══════════════════════════════════════════ */
let elements = [];
let connections = [];
let selectedId = null;
let currentTool = 'select';
let dragging = null;
let dragOff = {x:0,y:0};
let connectStart = null;
let idCnt = 1;
let activeTab = 'props';
const GRID = 20;

const EL_DEFAULTS = {
  zone:      { label:'Дільниця / РМ', w:260, h:160, collapsed: false },
  process:   { label:'Процес',        ct:60,  co:30,  uptime:85, operators:1, shifts:1, zoneId: null },
  inventory: { label:'Запаси',        qty:500, days:2 },
  customer:  { label:'Клієнт',        demand:500 },
  supplier:  { label:'Постачальник',  lead:5 },
  kaizen:    { label:'Kaizen',        note:'Покращення' },
};

const EL_COLORS = {
  zone:     { fill:'rgba(24, 95, 165, 0.03)', stroke:'#185fa5', text:'#185fa5' },
  process:  { fill:'#e6f1fb', stroke:'#185fa5', text:'#0c447c' },
  inventory:{ fill:'#faeeda', stroke:'#ba7517', text:'#633806' },
  customer: { fill:'#eaf3de', stroke:'#3b6d11', text:'#27500a' },
  supplier: { fill:'#eaf3de', stroke:'#3b6d11', text:'#27500a' },
  kaizen:   { fill:'#faece7', stroke:'#993c1d', text:'#4a1b0c' },
};

const CONN_COLORS = { push:'#444441', pull:'#1d9e75', info:'#185fa5', transport:'#ba7517' };
const CONN_NAMES  = { push:'Push',    pull:'Pull',    info:'Інфо',   transport:'Транспорт' };

function elBBox(el) {
  if (el.type === 'zone') return { x:el.x, y:el.y, w:el.w||260, h:el.collapsed?40:el.h||160 };
  const sizes = { process:{w:120,h:72}, inventory:{w:90,h:65}, customer:{w:100,h:62}, supplier:{w:100,h:62}, kaizen:{w:60,h:60} };
  const s = sizes[el.type] || {w:100,h:60};
  return { x:el.x, y:el.y, w:s.w, h:s.h };
}

function elCenter(el) {
  // Якщо процес всередині згорнутої зони — лінія підключається до центру самої зони
  if (el.zoneId) {
    const parent = elements.find(z => z.id === el.zoneId);
    if (parent && parent.collapsed) return elCenter(parent);
  }
  const b = elBBox(el); 
  return { x:b.x + b.w/2, y:b.y + b.h/2 };
}

function newId() { return 'e'+Date.now()+(idCnt++); }

/* ══════════════════════════════════════════
   RENDER LOGIC
══════════════════════════════════════════ */
function renderAll() {
  updateZoneAssignments(); // Перевіряємо, які процеси потрапили в яку дільницю
  renderZones();
  renderConnections();
  renderElements();
  updateTimeline();
  if (activeTab === 'metrics') updateMetrics();
  if (activeTab === 'maps') renderMapsList();
}

function svg(tag, attrs, inner) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs||{})) el.setAttribute(k,v);
  if (inner) el.innerHTML = inner;
  return el;
}
function txt(x,y,content,attrs) {
  return svg('text', {x,y,'text-anchor':'middle','dominant-baseline':'central','font-family':'Inter,sans-serif',...(attrs||{})}, content);
}

// Автоматична прив'язка процесів до Зон за координатами
function updateZoneAssignments() {
  const zones = elements.filter(e => e.type === 'zone');
  elements.forEach(el => {
    if (el.type === 'process') {
      el.zoneId = null;
      // Шукаємо, в яку зону входить лівий верхній кут процесу
      for (const z of zones) {
        if (el.x >= z.x && el.x <= z.x + (z.w||260) && el.y >= z.y && el.y <= z.y + (z.h||160)) {
          el.zoneId = z.id;
          break;
        }
      }
    }
  });
}

function isBottleneck(el) {
  if (el.type !== 'process') return false;
  const procs = elements.filter(e=>e.type==='process');
  if (procs.length < 2) return false;
  return el.ct === Math.max(...procs.map(p=>p.ct));
}
function getTakt() {
  const c = elements.find(e=>e.type==='customer');
  return c && c.demand ? Math.round(28800/c.demand) : 0;
}

// Окремий рендер для Дільниць (Зон)
function renderZones() {
  const layer = document.getElementById('zoneLayer');
  layer.innerHTML = '';
  const zones = elements.filter(e => e.type === 'zone');
  
  zones.forEach(z => {
    const G = svg('g', { id:'g_'+z.id, style:'cursor:move' });
    G.addEventListener('mousedown', e => elMouseDown(e, z.id));
    
    const b = elBBox(z);
    const c = EL_COLORS.zone;
    
    // Фоновий прямокутник дільниці
    G.appendChild(svg('rect', {
      x: b.x, y: b.y, width: b.w, height: b.h, rx: 6,
      fill: c.fill, stroke: c.stroke, 'stroke-width': 1.5,
      'stroke-dasharray': z.collapsed ? 'none' : '6 4'
    }));

    // Плашка заголовка дільниці
    G.appendChild(svg('rect', {
      x: b.x, y: b.y, width: b.w, height: 30, rx: 4,
      fill: z.collapsed ? '#e6f1fb' : 'rgba(24, 95, 165, 0.1)'
    }));

    // Текст назви дільниці
    const title = svg('text', { x: b.x + 12, y: b.y + 15, 'dominant-baseline':'central', 'font-size':'11', 'font-weight':'700', fill: c.text });
    title.textContent = z.label + (z.collapsed ? ` (Згорнуто операції)` : '');
    G.appendChild(title);

    // Кнопка Згорнути / Розгорнути [+ / -]
    const btnG = svg('g', { style: 'cursor: pointer;' });
    btnG.appendChild(svg('circle', { cx: b.x + b.w - 20, cy: b.y + 15, r: 8, fill: '#fff', stroke: c.stroke, 'stroke-width': 1 }));
    btnG.appendChild(txt(b.x + b.w - 20, b.y + 15, z.collapsed ? '+' : '-', { 'font-size': '12', 'font-weight': '700', fill: c.text }));
    
    btnG.addEventListener('mousedown', e => {
      e.stopPropagation();
      z.collapsed = !z.collapsed;
      renderAll();
    });
    G.appendChild(btnG);

    // Якщо згорнуто — виводимо агреговані метрики дільниці всередині рамки
    if (z.collapsed) {
      const childProcs = elements.filter(p => p.zoneId === z.id);
      const totalCt = childProcs.reduce((sum, p) => sum + p.ct, 0);
      const avgUptime = childProcs.length ? Math.round(childProcs.reduce((sum, p) => sum + p.uptime, 0) / childProcs.length) : 0;
      
      const statsTxt = svg('text', { x: b.x + 12, y: b.y + 40, 'font-size': '10', fill: '#5f5e5a' });
      statsTxt.textContent = `Операцій: ${childProcs.length} | Спільний СТ: ${totalCt}с | Сер. Uptime: ${avgUptime}%`;
      G.appendChild(statsTxt);
    }

    if (selectedId === z.id) {
      G.appendChild(svg('rect', { x: b.x-3, y: b.y-3, width: b.w+6, height: b.h+6, rx: 8, fill: 'none', stroke: '#185fa5', 'stroke-width': '1.5', 'stroke-dasharray': '3 3' }));
    }

    layer.appendChild(G);
  });
}

function renderElements() {
  const layer = document.getElementById('elLayer');
  layer.innerHTML = '';
  
  elements.forEach(el => {
    if (el.type === 'zone') return; // Зони вже відрендерені на своєму шарі
    
    // Якщо процес знаходиться всередині згорнутої зони, ми його не малюємо
    if (el.zoneId) {
      const parentZone = elements.find(z => z.id === el.zoneId);
      if (parentZone && parentZone.collapsed) return;
    }

    const G = svg('g', { id:'g_'+el.id, style:'cursor:'+(currentTool==='connect'?'crosshair':'move') });
    G.addEventListener('mousedown', e=>elMouseDown(e,el.id));

    const c = EL_COLORS[el.type] || EL_COLORS.process;
    const bn = isBottleneck(el);
    const tk = getTakt();

    if (el.type === 'process') {
      const strokeC = bn ? '#a32d2d' : c.stroke;
      const strokeW = bn ? 2 : 1;
      G.appendChild(svg('rect',{x:el.x,y:el.y,width:120,height:72,rx:4,fill:c.fill,stroke:strokeC,'stroke-width':strokeW}));
      if (bn) G.appendChild(svg('rect',{x:el.x,y:el.y,width:120,height:5,rx:2,fill:'#e24b4a'}));
      G.appendChild(txt(el.x+60, el.y+13, el.label, {'font-size':'11','font-weight':'600',fill:c.text}));
      G.appendChild(svg('line',{x1:el.x+6,y1:el.y+22,x2:el.x+114,y2:el.y+22,stroke:c.stroke,'stroke-width':'0.5'}));
      
      const rows = [
        `CT: ${el.ct}s    C/O: ${el.co}s`,
        `Uptime: ${el.uptime}%    Op: ${el.operators}`,
        `Зміни: ${el.shifts}${bn?' ◀ ВУЗЬКЕ':tk&&el.ct>tk?' ▲ > такту':''}`,
      ];
      rows.forEach((r,i)=>{
        const t = svg('text',{x:el.x+7,y:el.y+31+i*13,'font-size':'9','font-family':'Inter,sans-serif',fill: i===2&&bn?'#a32d2d':c.text});
        t.textContent=r; G.appendChild(t);
      });
    } else if (el.type === 'inventory') {
      G.appendChild(svg('polygon',{points:`${el.x+45},${el.y} ${el.x+90},${el.y+50} ${el.x},${el.y+50}`,fill:c.fill,stroke:c.stroke,'stroke-width':'1.2','stroke-linejoin':'round'}));
      G.appendChild(txt(el.x+45,el.y+33,"I",{'font-size':'14','font-weight':'800',fill:c.text, opacity:'0.3'}));
      G.appendChild(txt(el.x+45,el.y+24,el.qty.toString(),{'font-size':'11','font-weight':'700',fill:c.text}));
      G.appendChild(txt(el.x+45,el.y+60,el.days+' дн',{'font-size':'10','font-weight':'600',fill:c.text}));
    } else if (el.type === 'customer' || el.type === 'supplier') {
      const dPath = `M${el.x} ${el.y+12} L${el.x+25} ${el.y+12} L${el.x+25} ${el.y} L${el.x+50} ${el.y+12} L${el.x+50} ${el.y} L${el.x+75} ${el.y+12} L${el.x+75} ${el.y} L${el.x+100} ${el.y+12} L${el.x+100} ${el.y+45} L${el.x} ${el.y+45} Z`;
      G.appendChild(svg('path',{d:dPath,fill:c.fill,stroke:c.stroke,'stroke-width':'1.3','stroke-linejoin':'round'}));
      G.appendChild(txt(el.x+50,el.y+28,el.label,{'font-size':'10','font-weight':'600',fill:c.text}));
      if (el.type==='customer') {
        G.appendChild(txt(el.x+50,el.y+55,el.demand+' шт/зм',{'font-size':'10','font-weight':'500',fill:c.text}));
      } else {
        G.appendChild(txt(el.x+50,el.y+55,'Плечо: '+el.lead+' дн',{'font-size':'10','font-weight':'500',fill:c.text}));
      }
    } else if (el.type === 'kaizen') {
      const points = `${el.x+30},${el.y} ${el.x+38},${el.y+12} ${el.x+52},${el.y+6} ${el.x+44},${el.y+20} ${el.x+58},${el.y+30} ${el.x+43},${el.y+36} ${el.x+48},${el.y+52} ${el.x+34},${el.y+42} ${el.x+22},${el.y+56} ${el.x+20},${el.y+38} ${el.x+4},${el.y+36} ${el.x+17},${el.y+24} ${el.x+6},${el.y+12} ${el.x+20},${el.y+15} Z`;
      G.appendChild(svg('polygon',{points,fill:c.fill,stroke:c.stroke,'stroke-width':'1.2','stroke-linejoin':'round'}));
      G.appendChild(txt(el.x+30,el.y+22,"⚡",{'font-size':'12'}));
      G.appendChild(txt(el.x+30,el.y+35,el.label.slice(0,9),{'font-size':'9','font-weight':'700',fill:c.text}));
    }

    if (selectedId === el.id) {
      const b = elBBox(el);
      G.insertBefore(svg('rect',{x:b.x-4,y:b.y-4,width:b.w+8,height:b.h+8,rx:8,fill:'none',stroke:'#185fa5','stroke-width':'1.5','stroke-dasharray':'5 3'}), G.firstChild);
    }
    layer.appendChild(G);
  });
}

function renderConnections() {
  const layer = document.getElementById('connLayer');
  layer.innerHTML = '';
  connections.forEach(conn => {
    const from = elements.find(e=>e.id===conn.from);
    const to   = elements.find(e=>e.id===conn.to);
    if (!from||!to) return;
    
    const fc = elCenter(from), tc = elCenter(to);
    const color = CONN_COLORS[conn.type]||'#888';
    const dash  = conn.type==='pull'?'7 4':conn.type==='transport'?'3 3':'none';
    const G = svg('g');
    
    if (conn.type==='info') {
      const mx=(fc.x+tc.x)/2, my=Math.min(fc.y,tc.y)-35;
      G.appendChild(svg('path',{d:`M${fc.x} ${fc.y} Q${mx} ${my} ${tc.x} ${tc.y}`,fill:'none',stroke:color,'stroke-width':'1.5','stroke-dasharray':'5 3','marker-end':'url(#arr)'}));
    } else {
      G.appendChild(svg('line',{x1:fc.x,y1:fc.y,x2:tc.x,y2:tc.y,stroke:color,'stroke-width':'1.5','stroke-dasharray':dash,'marker-end':'url(#arr)'}));
    }
    const mx2=(fc.x+tc.x)/2, my2=(fc.y+tc.y)/2-9;
    G.appendChild(txt(mx2, my2, CONN_NAMES[conn.type], { 'font-size':'9', fill:color }));
    layer.appendChild(G);
  });
}

/* ══════════════════════════════════════════
   DRAG AND DROP & MOUSE INTERACTIONS
══════════════════════════════════════════ */
function palDragStart(e, type) { e.dataTransfer.setData('type', type); }

function onDrop(e) {
  const type = e.dataTransfer.getData('type');
  if (!EL_DEFAULTS[type]) return;
  const canvasEl = document.getElementById('canvas');
  const r = canvasEl.getBoundingClientRect();
  const x = snap(e.clientX - r.left);
  const y = snap(e.clientY - r.top);
  
  const el = { id: newId(), type, x, y, ...JSON.parse(JSON.stringify(EL_DEFAULTS[type])) };
  elements.push(el);
  renderAll();
  selectEl(el.id);
}

function snap(v) { return Math.round(v/GRID)*GRID; }

function elMouseDown(e, id) {
  e.stopPropagation();
  if (currentTool === 'connect') {
    if (!connectStart) {
      connectStart = id;
      document.getElementById('tempArrow').style.display='';
    } else if (connectStart !== id) {
      showConnectTypeModal(connectStart, id);
      connectStart = null;
      document.getElementById('tempArrow').style.display='none';
      renderAll();
    }
    return;
  }
  selectEl(id);
  dragging = id;
  const el = elements.find(e=>e.id===id);
  const svgR = document.getElementById('canvas').getBoundingClientRect();
  dragOff = { x: e.clientX - svgR.left - el.x, y: e.clientY - svgR.top - el.y };
}

function svgMouseDown(e) {
  if (e.target.id==='gridBg' || e.target===document.getElementById('canvas')) {
    selectedId = null;
    connectStart = null;
    document.getElementById('tempArrow').style.display='none';
    renderAll();
    showProps();
  }
}

function svgMouseMove(e) {
  const r = document.getElementById('canvas').getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  
  if (connectStart) {
    const from = elements.find(el=>el.id===connectStart);
    if (from) {
      const fc = elCenter(from);
      const tl = document.getElementById('tempLine');
      tl.setAttribute('x1',fc.x); tl.setAttribute('y1',fc.y);
      tl.setAttribute('x2',mx);   tl.setAttribute('y2',my);
    }
  }
  
  if (dragging) {
    const el = elements.find(e=>e.id===dragging);
    if (el) { 
      const oldX = el.x;
      const oldY = el.y;
      el.x = snap(mx-dragOff.x); 
      el.y = snap(my-dragOff.y); 

      // Якщо перетягуємо дільницю (зону), переміщуємо процеси всередині неї синхронно
      if (el.type === 'zone') {
        const dx = el.x - oldX;
        const dy = el.y - oldY;
        elements.forEach(child => {
          if (child.zoneId === el.id) { child.x += dx; child.y += dy; }
        });
      }
      renderAll(); 
    }
  }
}

function svgMouseUp() { dragging=null; }

function selectEl(id) { selectedId=id; renderAll(); showProps(); }

function deleteSelected() {
  if (!selectedId) return;
  elements    = elements.filter(e=>e.id!==selectedId);
  connections = connections.filter(c=>c.from!==selectedId&&c.to!==selectedId);
  // Скидаємо зону для процесів, якщо зона була видалена
  elements.forEach(el => { if(el.zoneId === selectedId) el.zoneId = null; });
  selectedId  = null;
  renderAll(); showProps();
}

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key==='v'||e.key==='V') setTool('select');
  if (e.key==='c'||e.key==='C') setTool('connect');
  if (e.key==='Delete'||e.key==='Backspace') deleteSelected();
});

function setTool(t) {
  currentTool = t; connectStart = null;
  document.getElementById('tempArrow').style.display='none';
  document.getElementById('btn-select').classList.toggle('active', t==='select');
  document.getElementById('btn-connect').classList.toggle('active', t==='connect');
  document.getElementById('canvasWrap').classList.toggle('connect-mode', t==='connect');
  renderAll();
}

   CONNECT TYPE MODAL

function showConnectTypeModal(fromId, toId) {
  const types = [
    { key:'push',      icon:'ti-arrow-right',    label:'Push потік',        sub:'Матеріальний потік (виштовхування)' },
    { key:'pull',      icon:'ti-arrow-left',      label:'Pull потік',        sub:'Матеріальний потік (витягування)' },
    { key:'info',      icon:'ti-message-circle',  label:'Інформаційний потік', sub:'Замовлення, плани, сигнали' },
    { key:'transport', icon:'ti-truck',            label:'Зовнішній транспорт', sub:'Доставка від постачальника' },
  ];
  const body = `<div class="modal-title">Тип з'єднання</div>
    <div class="modal-opts">
      ${types.map(t=>`
        <div class="modal-opt" onclick="addConn('${fromId}','${toId}','${t.key}');closeModal()">
          <i class="ti ${t.icon}" style="font-size:20px;color:${CONN_COLORS[t.key]}"></i>
          <div><div class="modal-opt-title">${t.label}</div><div class="modal-opt-sub">${t.sub}</div></div>
        </div>`).join('')}
    </div>
    <div class="modal-btns"><button class="modal-btn" onclick="closeModal()">Скасувати</button></div>`;
  openModal(body);
}

function addConn(from, to, type) { connections.push({from, to, type}); renderAll(); }

/* ══════════════════════════════════════════
   PROPERTIES PANEL (RIGHT)
══════════════════════════════════════════ */
function switchRTab(t) {
  activeTab = t;
  ['props','metrics','maps','ai'].forEach(tab => {
    document.getElementById('rpb-'+tab).style.display = tab===t ? '' : 'none';
    document.getElementById('rtab-'+tab).classList.toggle('active', tab===t);
  });
  if (t==='metrics') updateMetrics();
  if (t==='maps')    renderMapsList();
}

function showProps() {
  const msg  = document.getElementById('noSelMsg');
  const form = document.getElementById('propsForm');
  if (!selectedId) { msg.style.display=''; form.style.display='none'; return; }
  const el = elements.find(e=>e.id===selectedId);
  if (!el) { msg.style.display=''; form.style.display='none'; return; }
  msg.style.display='none'; form.style.display='';

  const FIELDS = {
    zone: [
      {key:'label', lbl:'Назва дільниці / РМ',   type:'text'},
      {key:'w',     lbl:'Ширина контейнера (px)',type:'number', row:true},
      {key:'h',     lbl:'Висота контейнера (px)',type:'number', row:true},
    ],
    process: [
      {key:'label', lbl:'Назва процесу',         type:'text'},
      {key:'ct',    lbl:'Час циклу CT (сек)',     type:'number', row:true},
      {key:'co',    lbl:'Переналадка C/O (сек)',  type:'number', row:true},
      {key:'uptime',lbl:'Доступність (%)',         type:'number', row:true},
      {key:'operators',lbl:'Операторів',           type:'number', row:true},
      {key:'shifts',lbl:'Змін на добу',            type:'number'},
    ],
    inventory: [
      {key:'label', lbl:'Назва',              type:'text'},
      {key:'qty',   lbl:'Кількість (шт)',     type:'number', row:true},
      {key:'days',  lbl:'Днів запасу',        type:'number', row:true},
    ],
    customer:  [
      {key:'label',  lbl:'Назва',              type:'text'},
      {key:'demand', lbl:'Попит (шт/зміна)',   type:'number'},
    ],
    supplier:  [
      {key:'label', lbl:'Назва',              type:'text'},
      {key:'lead',  lbl:'Плече поставки (дн)', type:'number'},
    ],
    kaizen:    [
      {key:'label', lbl:'Назва',    type:'text'},
      {key:'note',  lbl:'Примітка', type:'text'},
    ],
  };

  const flds = FIELDS[el.type]||[];
  let html = `<div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:10px;">${el.type} · ${el.id.slice(-6)}</div>`;
  let i=0;
  while (i<flds.length) {
    const f=flds[i];
    if (f.row && i+1<flds.length && flds[i+1].row) {
      const f2=flds[i+1];
      html+=`<div class="prop-row">
        <div class="prop-group"><div class="prop-label">${f.lbl}</div>
          <input class="prop-input" type="${f.type}" value="${el[f.key]}" oninput="setProp('${el.id}','${f.key}',this.value)"></div>
        <div class="prop-group"><div class="prop-label">${f2.lbl}</div>
          <input class="prop-input" type="${f2.type}" value="${el[f2.key]}" oninput="setProp('${el.id}','${f2.key}',this.value)"></div>
      </div>`;
      i+=2;
    } else {
      html+=`<div class="prop-group"><div class="prop-label">${f.lbl}</div>
        <input class="prop-input" type="${f.type}" value="${el[f.key]}" oninput="setProp('${el.id}','${f.key}',this.value)"></div>`;
      i++;
    }
  }

  // Якщо це зона, виведемо список вкладених операцій
  if (el.type === 'zone') {
    const children = elements.filter(p => p.zoneId === el.id);
    html += `<div class="section-head">Включені операції (${children.length})</div>`;
    if(!children.length) html += `<div style="font-size:11px;color:var(--text3);padding:4px 0;">Перетягніть операції всередину рамки дільниці</div>`;
    children.forEach(c => {
      html += `<div class="proc-row"><div class="proc-dot" style="background:var(--accent)"></div><span style="font-size:11px">${c.label} (${c.ct}с)</span></div>`;
    });
  }

  const myConns = connections.filter(c=>c.from===el.id||c.to===el.id);
  if (myConns.length) {
    html += `<div class="section-head">З'єднання (${myConns.length})</div>`;
    myConns.forEach(c=>{
      const other = elements.find(e=>e.id===(c.from===el.id?c.to:c.from));
      const dir   = c.from===el.id?'→':'←';
      html += `<div class="proc-row">
        <div class="proc-dot" style="background:${CONN_COLORS[c.type]}"></div>
        <span style="flex:1;font-size:11px">${CONN_NAMES[c.type]} ${dir} ${other?other.label:'?'}</span>
        <button onclick="delConn('${c.from}','${c.to}')" style="font-size:11px;background:none;border:none;cursor:pointer;color:var(--text3);padding:2px 4px;">✕</button>
      </div>`;
    });
  }

  html += `<button class="del-btn" onclick="deleteSelected()"><i class="ti ti-trash"></i> Видалити елемент</button>`;
  form.innerHTML = html;
}

function setProp(id, key, val) {
  const el = elements.find(e=>e.id===id);
  if (!el) return;
  el[key] = (isNaN(+val)||val===''||key=='label'||key=='note') ? val : +val;
  renderAll();
}

function delConn(from, to) { connections = connections.filter(c=>!(c.from===from&&c.to===to)); renderAll(); showProps(); }

/* ══════════════════════════════════════════
   METRICS CALCULATION
══════════════════════════════════════════ */
function getProcs()  { return elements.filter(e=>e.type==='process'); }
function getInvs()   { return elements.filter(e=>e.type==='inventory'); }

function updateMetrics() {
  const procs   = getProcs();
  const invs    = getInvs();
  const takt    = getTakt();
  const vaTime  = procs.reduce((s,p)=>s+p.ct,0);
  const invDays = invs.reduce((s,i)=>s+i.days,0);
  const nvaTime = invDays * 28800;
  const lt      = vaTime + nvaTime;
  const eff     = lt > 0 ? Math.round(vaTime/lt*100) : 0;
  const bn      = procs.reduce((b,p)=>(!b||p.ct>b.ct)?p:b,null);

  const effColor = eff<10?'var(--danger)':eff<30?'var(--warn)':'var(--success)';
  const effBg    = eff<10?'var(--danger-bg)':eff<30?'var(--warn-bg)':'var(--success-bg)';

  document.getElementById('metricsContent').innerHTML = `
    <div class="metric-card">
      <div class="metric-lbl">Час доданої цінності (VA)</div>
      <div class="metric-val">${fmtT(vaTime)}</div>
      <div class="metric-sub">${procs.length} процес(ів)</div>
    </div>
    <div class="metric-card">
      <div class="metric-lbl">Час такту</div>
      <div class="metric-val" style="color:${takt?'var(--success)':'var(--text3)'}">${takt?takt+'s':'—'}</div>
      <div class="metric-sub">Вимога: ${elements.find(e=>e.type==='customer')?.demand||'?'} шт/зм</div>
    </div>
    <div class="metric-card">
      <div class="metric-lbl">Запаси</div>
      <div class="metric-val">${invDays} дн</div>
      <div class="metric-sub">NVA: ${fmtT(nvaTime)}</div>
    </div>
    <div class="metric-card" style="background:${effBg};border-color:${effColor}">
      <div class="metric-lbl" style="color:${effColor}">Ефективність потоку</div>
      <div class="metric-val" style="color:${effColor}">${eff}%</div>
    </div>
  `;
}

function fmtT(s) {
  if (!s) return '0s';
  if (s<60) return s+'s';
  if (s<3600) return Math.round(s/60)+'хв';
  return (s/3600).toFixed(1)+'год';
}

function updateTimeline() {
  const vaTime  = getProcs().reduce((s,p)=>s+p.ct,0);
  const invDays = getInvs().reduce((s,i)=>s+i.days,0);
  const nvaTime = invDays*28800;
  const lt      = vaTime+nvaTime;
  const eff     = lt>0?Math.round(vaTime/lt*100):0;
  const vaPct   = lt>0?Math.max(2,Math.round(vaTime/lt*100)):5;
  
  document.getElementById('tlBar').innerHTML = `
    <div class="tl-va" style="width:${vaPct}%"><span class="tl-bar-lbl">${eff>15?'VA':''}</span></div>
    <div class="tl-nva" style="width:${100-vaPct}%"><span class="tl-bar-lbl">NVA</span></div>`;
  document.getElementById('tlLT').innerHTML  = `LT: <strong>${fmtT(lt)}</strong>`;
  document.getElementById('tlEff').style.color = eff<10?'var(--danger)':eff<30?'var(--warn)':'var(--success)';
  document.getElementById('tlEff').textContent = eff+'%';
}

/* ══════════════════════════════════════════
   STORAGE & MAPS MANAGEMENT
══════════════════════════════════════════ */
function getState() { return { version:3, name:document.getElementById('mapName').value, ts:Date.now(), elements, connections }; }

function loadState(state) {
  elements    = state.elements    || [];
  connections = state.connections || [];
  document.getElementById('mapName').value = state.name || 'VSM карта';
  idCnt       = elements.length + 1; selectedId  = null;
  renderAll(); showProps();
}

function getAllMaps() { try { return JSON.parse(localStorage.getItem('vsm_maps')||'{}'); } catch { return {}; } }
function saveToLocal() {
  const name = document.getElementById('mapName').value.trim() || 'VSM карта';
  const maps = getAllMaps(); maps[name]  = getState();
  localStorage.setItem('vsm_maps', JSON.stringify(maps));
  toast('Збережено: '+name,'ok');
}
function loadFromLocal(name) { const maps = getAllMaps(); if (maps[name]) { loadState(maps[name]); toast('Відкрито: '+name,'ok'); } }
function deleteMap(name) {
  const maps = getAllMaps(); delete maps[name];
  localStorage.setItem('vsm_maps', JSON.stringify(maps)); renderMapsList(); toast('Видалено: '+name);
}

function renderMapsList() {
  const maps = getAllMaps(); const keys = Object.keys(maps);
  const mc = document.getElementById('mapsContent');
  if (!keys.length) { mc.innerHTML='<div class="empty-maps">Немає збережених карт.</div>'; return; }
  mc.innerHTML = `<div class="prop-group"><button class="ai-run-btn" onclick="saveToLocal()"><i class="ti ti-device-floppy"></i> Зберегти поточну</button></div>` +
    keys.map(name=>{
      return `<div class="map-row" onclick="loadFromLocal('${name.replace(/'/g,"\\'")}')">
        <i class="ti ti-file-text" style="font-size:16px;color:var(--accent)"></i>
        <div style="flex:1;overflow:hidden"><div class="map-row-name">${name}</div></div>
        <button class="map-del-btn" onclick="event.stopPropagation();if(confirm('Видалити?'))deleteMap('${name.replace(/'/g,"\\'")}')">✕</button>
      </div>`;
    }).join('');
}

function exportJSON() {
  const json = JSON.stringify(getState(), null, 2);
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
  a.download = 'vsm_map.json'; a.click();
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { try { loadState(JSON.parse(ev.target.result)); toast('Імпортовано','ok'); } catch { toast('Помилка файлу','err'); } };
  reader.readAsText(file);
}

/* ══════════════════════════════════════════
   GEMINI AI INTEGRATION
══════════════════════════════════════════ */
function saveApiKey() {
  const k = document.getElementById('aiKeyInput').value.trim();
  localStorage.setItem('vsm_api_key', k); toast('Ключ збережено','ok');
}

async function runAi() {
  const key = localStorage.getItem('vsm_api_key')||'';
  if (!key) { toast('Введіть API ключ','err'); return; }
  const btn = document.getElementById('aiRunBtn');
  const out = document.getElementById('aiOut');
  btn.disabled=true; out.style.display=''; out.textContent='Аналізую...';

  const summary = `Карта: "${document.getElementById('mapName').value}"
Процеси: ${getProcs().map(p=>`${p.label}(CT=${p.ct}s, Zone=${p.zoneId?'так':'ні'})`).join(', ')}`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: `Зроби коротку бізнес-оцінку Lean для потоку: ${summary}. Відповідь українською.` }] }] })
    });
    const data = await resp.json();
    out.textContent = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Помилка відповіді';
  } catch(err) { out.textContent = 'Помилка: ' + err.message; }
  btn.disabled=false;
}
